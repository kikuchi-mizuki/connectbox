<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Connect Box｜課題タイプ管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #152238;
      --ink-soft: #3a4a63;
      --brand: #4a5ba8;
      --accent: #e8941a;
      --surface: #f3f5f9;
      --line: #dde2eb;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--ink);
      background: var(--surface);
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: var(--ink);
      color: #fff;
    }
    header h1 { margin: 0; font-size: 1rem; }
    header .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button, .btn {
      font: inherit;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      font-weight: 700;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    button.ghost, .btn.ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
    }
    button.accent { background: var(--accent); }
    button.danger { background: var(--danger); }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.15rem;
    }
    .card h2 { margin: 0 0 0.75rem; font-size: 1rem; }
    .hint { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 1rem; }
    label {
      display: grid;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 0.65rem;
    }
    input, textarea, select {
      font: inherit;
      font-weight: 400;
      font-size: 0.88rem;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      width: 100%;
      color: var(--ink);
    }
    textarea { min-height: 4.2rem; resize: vertical; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .case-block {
      border-top: 1px solid var(--line);
      padding-top: 0.85rem;
      margin-top: 0.85rem;
    }
    .case-block h3 { margin: 0 0 0.5rem; font-size: 0.9rem; }
    .status { font-size: 0.8rem; color: #9fe6b0; }
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: end;
      margin-bottom: 0.75rem;
    }
    .toolbar-row label { margin: 0; flex: 1; min-width: 220px; }
  </style>
</head>
<body>
  <header>
    <h1>Connect Box｜課題タイプ／プラン管理</h1>
    <div class="actions">
      <span class="status" id="status"></span>
      <a class="btn ghost" href="/lp/back-office/deck">資料を見る</a>
      <button type="button" class="ghost" id="btn-reload">JSON再読込</button>
      <button type="button" class="accent" id="btn-save">ブラウザに保存</button>
      <button type="button" id="btn-download">JSONダウンロード</button>
      <button type="button" class="ghost" id="btn-clear">保存を消す</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>使い方</h2>
      <p class="hint">
        この画面でスライド文言を編集できます。「ブラウザに保存」で同じPCの商談資料にすぐ反映されます。<br />
        本番反映は「JSONダウンロード」→ <code>public/lp/back-office/deck-content.json</code> を差し替えてデプロイ。<br />
        編集できる主な項目：2ページ目の事業フェーズ、料金プラン、課題タイプごとの御社向けプラン（Phase・目標数字）。
      </p>
    </section>

    <section class="card">
      <h2>なぜT-connectなのか</h2>
      <div id="why-editor"></div>
    </section>

    <section class="card">
      <h2>企業がやることのフェーズ</h2>
      <div id="about-editor"></div>
    </section>

    <section class="card">
      <h2>料金プラン</h2>
      <div id="plans-editor"></div>
    </section>

    <section class="card">
      <h2>課題タイプ（御社向けプラン含む）</h2>
      <div class="toolbar-row">
        <label>編集する課題
          <select id="challenge-select"></select>
        </label>
        <button type="button" id="btn-add">課題を追加</button>
        <button type="button" class="danger" id="btn-delete">この課題を削除</button>
      </div>
      <div id="challenge-editor"></div>
    </section>
  </main>

  <script>
    (function () {
      var CONTENT_URL = "/lp/back-office/deck-content.json";
      var CONTENT_KEY = "connectbox-backoffice-content-v1";
      var content = null;
      var currentId = "";

      var statusEl = document.getElementById("status");
      var whyEditor = document.getElementById("why-editor");
      var aboutEditor = document.getElementById("about-editor");
      var plansEditor = document.getElementById("plans-editor");
      var challengeSelect = document.getElementById("challenge-select");
      var challengeEditor = document.getElementById("challenge-editor");

      function setStatus(msg) {
        statusEl.textContent = msg || "";
      }

      function emptyChallenge() {
        var id = "challenge-" + Date.now().toString(36);
        return {
          id: id,
          label: "新しい課題タイプ",
          shortLabel: "新規",
          packName: "新しい支援パック",
          sceneLead: "この課題で起きやすい風景を書いてください。",
          pains: ["", "", "", ""],
          servicesLead: "",
          services: ["", "", "", "", "", "", ""],
          focusSvc: [0, 1, 2],
          teamSkill: "",
          teamStart: "",
          recommendPlan: 1,
          detachPhases: [
            { label: "今すぐ外に出す", hint: "定型で回せる仕事", items: ["", "", ""] },
            { label: "型づくり後に外に出す", hint: "手順が固まってから任せる", items: ["", "", ""] },
            { label: "社内に残す", hint: "判断・関係性が要る仕事", items: ["", "", ""] }
          ],
          cases: [0, 1, 2].map(function () {
            return {
              industry: "",
              num: "",
              title: "",
              challenge: "",
              action: "",
              effect: "",
            };
          }),
          phase1a: "",
          phase1b: "",
          phase1goal: "",
          phase2a: "",
          phase2b: "",
          phase2goal: "",
          phase3a: "",
          phase3b: "",
          phase3goal: "",
        };
      }

      function load() {
        var local = null;
        try {
          local = JSON.parse(localStorage.getItem(CONTENT_KEY) || "null");
        } catch (e) {}
        if (
          local &&
          Array.isArray(local.challenges) &&
          local.challenges.length &&
          (local.version || 0) >= 14
        ) {
          content = local;
          setStatus("ブラウザ保存データを表示中");
          return Promise.resolve(content);
        }
        return fetch(CONTENT_URL + "?t=" + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (json) {
            content = json;
            setStatus("deck-content.json を表示中");
            return content;
          });
      }

      function saveLocal() {
        readWhyFromForm();
        readAboutFromForm();
        readPlansFromForm();
        readChallengeFromForm();
        localStorage.setItem(CONTENT_KEY, JSON.stringify(content));
        setStatus("ブラウザに保存しました（資料へ反映済み）");
      }

      function download() {
        readWhyFromForm();
        readAboutFromForm();
        readPlansFromForm();
        readChallengeFromForm();
        var blob = new Blob([JSON.stringify(content, null, 2)], {
          type: "application/json",
        });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "deck-content.json";
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus("JSONをダウンロードしました");
      }


      function renderWhy() {
        if (!content.why) {
          content.why = {
            title: "なぜ、T-connectなのか",
            lead: "",
            belief: "",
            body: ["", ""],
            closing: "",
            closingShort: ""
          };
        }
        if (!whyEditor) return;
        whyEditor.innerHTML =
          "<label>タイトル<input id='why-title' /></label>" +
          "<label>リード（代表の背景）<textarea id='why-lead'></textarea></label>" +
          "<label>信念（大きく出す一文）<input id='why-belief' /></label>" +
          "<label>本文1<textarea id='why-body0'></textarea></label>" +
          "<label>本文2<textarea id='why-body1'></textarea></label>" +
          "<label>締めの一文<textarea id='why-closing'></textarea></label>" +
          "<label>Teamスライド用の短い締め<input id='why-closing-short' /></label>";
        var w = content.why;
        document.getElementById("why-title").value = w.title || "";
        document.getElementById("why-lead").value = w.lead || "";
        document.getElementById("why-belief").value = w.belief || "";
        document.getElementById("why-body0").value = (w.body && w.body[0]) || "";
        document.getElementById("why-body1").value = (w.body && w.body[1]) || "";
        document.getElementById("why-closing").value = w.closing || "";
        document.getElementById("why-closing-short").value = w.closingShort || "";
      }

      function readWhyFromForm() {
        if (!whyEditor || !document.getElementById("why-title")) return;
        if (!content.why) content.why = {};
        content.why.title = document.getElementById("why-title").value;
        content.why.lead = document.getElementById("why-lead").value;
        content.why.belief = document.getElementById("why-belief").value;
        content.why.body = [
          document.getElementById("why-body0").value,
          document.getElementById("why-body1").value
        ];
        content.why.closing = document.getElementById("why-closing").value;
        content.why.closingShort = document.getElementById("why-closing-short").value;
      }

      function renderAbout() {
        if (!content.about) {
          content.about = {
            title: "企業がやることのフェーズ",
            lead: "",
            phases: [],
          };
        }
        if (!content.about.phases || !content.about.phases.length) {
          content.about.phases = (content.about.items || []).map(function (it) {
            return { title: it.title || "", desc: it.desc || "", items: ["", "", "", "", ""] };
          });
        }
        while (content.about.phases.length < 4) {
          content.about.phases.push({ title: "", desc: "", items: ["", "", "", "", ""] });
        }
        var html = "";
        html += "<label>タイトル<input id='about-title' /></label>";
        html += "<label>リード文<textarea id='about-lead'></textarea></label>";
        content.about.phases.forEach(function (phase, i) {
          html += '<div class="case-block"><h3>フェーズ ' + (i + 1) + "</h3>";
          html += "<div class='grid-2'>";
          html += "<label>フェーズ名<input data-about='" + i + "' data-field='title' /></label>";
          html += "<label>一言説明<input data-about='" + i + "' data-field='desc' /></label>";
          html += "</div>";
          for (var j = 0; j < 5; j++) {
            html += "<label>項目 " + (j + 1) + "<input data-about='" + i + "' data-item='" + j + "' /></label>";
          }
          html += "</div>";
        });
        aboutEditor.innerHTML = html;
        document.getElementById("about-title").value = content.about.title || "";
        document.getElementById("about-lead").value = content.about.lead || "";
        content.about.phases.forEach(function (phase, i) {
          aboutEditor.querySelector("[data-about='" + i + "'][data-field='title']").value = phase.title || "";
          aboutEditor.querySelector("[data-about='" + i + "'][data-field='desc']").value = phase.desc || "";
          (phase.items || []).forEach(function (line, j) {
            var el = aboutEditor.querySelector("[data-about='" + i + "'][data-item='" + j + "']");
            if (el) el.value = line || "";
          });
        });
      }

      function readAboutFromForm() {
        if (!aboutEditor.querySelector("#about-title")) return;
        if (!content.about) content.about = { phases: [] };
        content.about.title = document.getElementById("about-title").value;
        content.about.lead = document.getElementById("about-lead").value;
        content.about.phases = [0, 1, 2, 3].map(function (i) {
          var items = [0, 1, 2, 3, 4].map(function (j) {
            var el = aboutEditor.querySelector("[data-about='" + i + "'][data-item='" + j + "']");
            return el ? el.value : "";
          }).filter(function (v, idx, arr) {
            // keep trailing empties for fixed 5 slots in deck; keep all
            return true;
          });
          return {
            title: aboutEditor.querySelector("[data-about='" + i + "'][data-field='title']").value,
            desc: aboutEditor.querySelector("[data-about='" + i + "'][data-field='desc']").value,
            items: items,
          };
        });
      }

      function renderPlans() {
        plansEditor.innerHTML = "";
        (content.plans || []).forEach(function (plan, i) {
          var wrap = document.createElement("div");
          wrap.className = "case-block";
          wrap.innerHTML =
            "<h3>プラン " + (i + 1) + "</h3>" +
            '<div class="grid-2">' +
            "<label>名前<input data-plan='" + i + "' data-field='name' /></label>" +
            "<label>料金<input data-plan='" + i + "' data-field='price' /></label>" +
            "<label>時間目安<input data-plan='" + i + "' data-field='hours' /></label>" +
            "<label>おすすめ<select data-plan='" + i + "' data-field='recommend'><option value='false'>いいえ</option><option value='true'>はい</option></select></label>" +
            "</div>" +
            "<label>特徴1<input data-plan='" + i + "' data-feat='0' /></label>" +
            "<label>特徴2<input data-plan='" + i + "' data-feat='1' /></label>" +
            "<label>特徴3<input data-plan='" + i + "' data-feat='2' /></label>";
          plansEditor.appendChild(wrap);
          wrap.querySelector("[data-field='name']").value = plan.name || "";
          wrap.querySelector("[data-field='price']").value = plan.price || "";
          wrap.querySelector("[data-field='hours']").value = plan.hours || "";
          wrap.querySelector("[data-field='recommend']").value = plan.recommend ? "true" : "false";
          (plan.features || []).forEach(function (f, fi) {
            var el = wrap.querySelector("[data-feat='" + fi + "']");
            if (el) el.value = f;
          });
        });
      }

      function readPlansFromForm() {
        (content.plans || []).forEach(function (plan, i) {
          plan.name = plansEditor.querySelector("[data-plan='" + i + "'][data-field='name']").value;
          plan.price = plansEditor.querySelector("[data-plan='" + i + "'][data-field='price']").value;
          plan.hours = plansEditor.querySelector("[data-plan='" + i + "'][data-field='hours']").value;
          plan.recommend =
            plansEditor.querySelector("[data-plan='" + i + "'][data-field='recommend']").value === "true";
          plan.features = [0, 1, 2].map(function (fi) {
            return plansEditor.querySelector("[data-plan='" + i + "'][data-feat='" + fi + "']").value;
          });
        });
      }

      function fillChallengeSelect() {
        challengeSelect.innerHTML = "";
        (content.challenges || []).forEach(function (c) {
          var opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.label + " (" + c.id + ")";
          challengeSelect.appendChild(opt);
        });
        if (!currentId && content.challenges.length) currentId = content.challenges[0].id;
        challengeSelect.value = currentId;
      }

      function currentChallenge() {
        return (content.challenges || []).find(function (c) {
          return c.id === currentId;
        });
      }

      function renderChallenge() {
        var ch = currentChallenge();
        if (!ch) {
          challengeEditor.innerHTML = "<p class='hint'>課題がありません。「課題を追加」してください。</p>";
          return;
        }
        var html = "";
        html += '<div class="grid-2">';
        html += "<label>ID（英数字）<input id='ch-id' /></label>";
        html += "<label>おすすめプラン番号（0/1/2）<input id='ch-rec' /></label>";
        html += "</div>";
        html += "<label>課題ラベル（プルダウンに出る文言）<input id='ch-label' /></label>";
        html += "<label>短縮名<input id='ch-short' /></label>";
        html += "<label>パック名<input id='ch-pack' /></label>";
        html += "<label>導入文（課題スライドのリード）<textarea id='ch-scene'></textarea></label>";
        html += "<label>サービス導入文<textarea id='ch-services-lead'></textarea></label>";
        html += "<label>体制スキル文言<input id='ch-skill' /></label>";
        html += "<label>開始の切り口<input id='ch-start' /></label>";
        for (var p = 0; p < 4; p++) {
          html += "<label>起きやすいこと " + (p + 1) + "<textarea id='ch-pain-" + p + "'></textarea></label>";
        }

        html += '<div class="case-block"><h3>任せやすいこと（フェーズで切り離す）</h3>';
        for (var d = 0; d < 3; d++) {
          html += "<label>列" + (d + 1) + " 見出し<input id='detach-" + d + "-label' /></label>";
          html += "<label>列" + (d + 1) + " 補足<input id='detach-" + d + "-hint' /></label>";
          for (var di = 0; di < 3; di++) {
            html += "<label>列" + (d + 1) + " 項目" + (di + 1) + "<input id='detach-" + d + "-i" + di + "' /></label>";
          }
        }
        html += "</div>";

        html += '<div class="case-block"><h3>御社向けプラン（編集可）</h3>';
        html += "<p class='hint'>課題タイプごとに Phase 内容と目標数字を変えられます。</p>";
        html += "<h3>Phase 1</h3>";
        html += "<label>内容A<input id='ph1a' /></label><label>内容B<input id='ph1b' /></label><label>目標（数字）<input id='ph1g' /></label>";
        html += "<h3>Phase 2</h3>";
        html += "<label>内容A<input id='ph2a' /></label><label>内容B<input id='ph2b' /></label><label>目標（数字）<input id='ph2g' /></label>";
        html += "<h3>Phase 3</h3>";
        html += "<label>内容A<input id='ph3a' /></label><label>内容B<input id='ph3b' /></label><label>目標（数字）<input id='ph3g' /></label>";
        html += "</div>";

        for (var c = 0; c < 3; c++) {
          html +=
            '<div class="case-block"><h3>具体イメージ ' + (c + 1) + "</h3>" +
            "<div class='grid-2'>" +
            "<label>タグ<input id='case-" + c + "-industry' /></label>" +
            "<label>想定効果（数値イメージ）<input id='case-" + c + "-num' /></label>" +
            "</div>" +
            "<label>タイトル<input id='case-" + c + "-title' /></label>" +
            "<label>課題<textarea id='case-" + c + "-challenge'></textarea></label>" +
            "<label>施策<textarea id='case-" + c + "-action'></textarea></label>" +
            "<label>効果<textarea id='case-" + c + "-effect'></textarea></label>" +
            "</div>";
        }
        challengeEditor.innerHTML = html;

        document.getElementById("ch-id").value = ch.id || "";
        document.getElementById("ch-rec").value = ch.recommendPlan != null ? ch.recommendPlan : 1;
        document.getElementById("ch-label").value = ch.label || "";
        document.getElementById("ch-short").value = ch.shortLabel || "";
        document.getElementById("ch-pack").value = ch.packName || "";
        document.getElementById("ch-scene").value = ch.sceneLead || "";
        document.getElementById("ch-services-lead").value = ch.servicesLead || "";
        document.getElementById("ch-skill").value = ch.teamSkill || "";
        document.getElementById("ch-start").value = ch.teamStart || "";
        (ch.pains || []).forEach(function (t, i) {
          var el = document.getElementById("ch-pain-" + i);
          if (el) el.value = t;
        });
        if (!ch.detachPhases) ch.detachPhases = [];
        while (ch.detachPhases.length < 3) {
          ch.detachPhases.push({ label: "", hint: "", items: ["", "", ""] });
        }
        ch.detachPhases.forEach(function (phase, d) {
          document.getElementById("detach-" + d + "-label").value = phase.label || "";
          document.getElementById("detach-" + d + "-hint").value = phase.hint || "";
          (phase.items || []).forEach(function (item, di) {
            var el = document.getElementById("detach-" + d + "-i" + di);
            if (el) el.value = item || "";
          });
        });
        document.getElementById("ph1a").value = ch.phase1a || "";
        document.getElementById("ph1b").value = ch.phase1b || "";
        document.getElementById("ph1g").value = ch.phase1goal || "";
        document.getElementById("ph2a").value = ch.phase2a || "";
        document.getElementById("ph2b").value = ch.phase2b || "";
        document.getElementById("ph2g").value = ch.phase2goal || "";
        document.getElementById("ph3a").value = ch.phase3a || "";
        document.getElementById("ph3b").value = ch.phase3b || "";
        document.getElementById("ph3g").value = ch.phase3goal || "";
        (ch.cases || []).forEach(function (c, i) {
          document.getElementById("case-" + i + "-industry").value = c.industry || "";
          document.getElementById("case-" + i + "-num").value = c.num || "";
          document.getElementById("case-" + i + "-title").value = c.title || "";
          document.getElementById("case-" + i + "-challenge").value = c.challenge || "";
          document.getElementById("case-" + i + "-action").value = c.action || "";
          document.getElementById("case-" + i + "-effect").value = c.effect || "";
        });
      }

      function readChallengeFromForm() {
        var ch = currentChallenge();
        if (!ch || !document.getElementById("ch-id")) return;
        var newId = document.getElementById("ch-id").value.trim() || ch.id;
        ch.id = newId;
        currentId = newId;
        ch.recommendPlan = parseInt(document.getElementById("ch-rec").value, 10);
        if (isNaN(ch.recommendPlan)) ch.recommendPlan = 1;
        ch.label = document.getElementById("ch-label").value;
        ch.shortLabel = document.getElementById("ch-short").value;
        ch.packName = document.getElementById("ch-pack").value;
        ch.sceneLead = document.getElementById("ch-scene").value;
        ch.servicesLead = document.getElementById("ch-services-lead").value;
        ch.teamSkill = document.getElementById("ch-skill").value;
        ch.teamStart = document.getElementById("ch-start").value;
        ch.pains = [0, 1, 2, 3].map(function (i) {
          return document.getElementById("ch-pain-" + i).value;
        });
        ch.detachPhases = [0, 1, 2].map(function (d) {
          return {
            label: document.getElementById("detach-" + d + "-label").value,
            hint: document.getElementById("detach-" + d + "-hint").value,
            items: [0, 1, 2].map(function (di) {
              return document.getElementById("detach-" + d + "-i" + di).value;
            }),
          };
        });
        ch.phase1a = document.getElementById("ph1a").value;
        ch.phase1b = document.getElementById("ph1b").value;
        ch.phase1goal = document.getElementById("ph1g").value;
        ch.phase2a = document.getElementById("ph2a").value;
        ch.phase2b = document.getElementById("ph2b").value;
        ch.phase2goal = document.getElementById("ph2g").value;
        ch.phase3a = document.getElementById("ph3a").value;
        ch.phase3b = document.getElementById("ph3b").value;
        ch.phase3goal = document.getElementById("ph3g").value;
        ch.cases = [0, 1, 2].map(function (i) {
          return {
            industry: document.getElementById("case-" + i + "-industry").value,
            num: document.getElementById("case-" + i + "-num").value,
            title: document.getElementById("case-" + i + "-title").value,
            challenge: document.getElementById("case-" + i + "-challenge").value,
            action: document.getElementById("case-" + i + "-action").value,
            effect: document.getElementById("case-" + i + "-effect").value,
          };
        });
      }

      function renderAll() {
        if (!content.challenges) content.challenges = [];
        if (!content.plans) content.plans = [];
        if (!currentId && content.challenges[0]) currentId = content.challenges[0].id;
        renderWhy();
        renderAbout();
        renderPlans();
        fillChallengeSelect();
        renderChallenge();
      }

      challengeSelect.addEventListener("change", function () {
        readChallengeFromForm();
        currentId = challengeSelect.value;
        renderChallenge();
      });

      document.getElementById("btn-add").addEventListener("click", function () {
        readChallengeFromForm();
        var ch = emptyChallenge();
        content.challenges.push(ch);
        currentId = ch.id;
        renderAll();
        setStatus("課題タイプを追加しました（保存してください）");
      });

      document.getElementById("btn-delete").addEventListener("click", function () {
        if (content.challenges.length <= 1) {
          alert("最低1つの課題タイプが必要です。");
          return;
        }
        if (!confirm("この課題タイプを削除しますか？")) return;
        content.challenges = content.challenges.filter(function (c) {
          return c.id !== currentId;
        });
        currentId = content.challenges[0].id;
        renderAll();
        setStatus("削除しました（保存してください）");
      });

      document.getElementById("btn-save").addEventListener("click", saveLocal);
      document.getElementById("btn-download").addEventListener("click", download);
      document.getElementById("btn-clear").addEventListener("click", function () {
        localStorage.removeItem(CONTENT_KEY);
        load().then(function () {
          currentId = content.challenges[0] ? content.challenges[0].id : "";
          renderAll();
        });
      });
      document.getElementById("btn-reload").addEventListener("click", function () {
        localStorage.removeItem(CONTENT_KEY);
        fetch(CONTENT_URL + "?t=" + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (json) {
            content = json;
            currentId = content.challenges[0] ? content.challenges[0].id : "";
            renderAll();
            setStatus("deck-content.json を再読込しました");
          });
      });

      load()
        .then(function () {
          currentId = content.challenges[0] ? content.challenges[0].id : "";
          renderAll();
        })
        .catch(function (e) {
          console.error(e);
          setStatus("読み込み失敗");
        });
    })();
  </script>
</body>
</html>
